# Parámetros de la preparación de datos para el paso 1.
# Se pueden cambiar sin tocar el código, por ejemplo:
# python src/preparar_datos.py --archivo data/raw/loan.csv

archivo_original: data/raw/loan.csv
diccionario: data/raw/LCDataDictionary.xlsx
fecha_descarga: "2026-10-26"        # cuándo bajamos el zip de Kaggle 

salida_modelo: data/processed/creditos_pd.csv.gz       # lo que usan los modelos
salida_post: data/processed/creditos_post.csv.gz       # variables de "después" (solo para construir la LGD)

# Codificación de la variable objetivo (tabla del enunciado) lo que no este aquí queda como NA.
objetivo:
  "Fully Paid": 0
  "Does not meet the credit policy. Status:Fully Paid": 0
  "Charged Off": 1
  "Default": 1
  "Late (31-120 days)": 1
  "Does not meet the credit policy. Status:Charged Off": 1

# Variables que se conocen el día de la solicitud y que usamos como entrada.
# La justificación de cada una (y de las que quitamos) está en docs/02_variables.md
numericas:
  - loan_amnt
  - int_rate
  - installment
  - annual_inc
  - dti
  - delinq_2yrs
  - inq_last_6mths
  - mths_since_last_delinq
  - mths_since_last_record
  - mths_since_last_major_derog
  - open_acc
  - pub_rec
  - revol_bal
  - revol_util
  - total_acc
  - collections_12_mths_ex_med
  - acc_now_delinq
  - tot_coll_amt
  - tot_cur_bal
  - total_rev_hi_lim

categoricas:
  - term
  - grade
  - sub_grade
  - emp_length
  - home_ownership
  - verification_status
  - purpose
  - addr_state
  - initial_list_status
  - application_type

# Variables que solo existen después del desembolso estas no entran a los modelos;
# se guardan aparte porque las necesitamos para calcular la LGD y la EAD para realizar la parte dos del trabako.
post_desembolso:
  - funded_amnt
  - funded_amnt_inv
  - out_prncp
  - out_prncp_inv
  - total_pymnt
  - total_pymnt_inv
  - total_rec_prncp
  - total_rec_int
  - total_rec_late_fee
  - recoveries
  - collection_recovery_fee
  - last_pymnt_d
  - last_pymnt_amnt
